name: Native release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      WAILS_VERSION: v3.1.0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Set package version from release tag
        if: github.ref_type == 'tag'
        run: node scripts/set-release-version.mjs "$GITHUB_REF_NAME"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json
      - name: Install Linux tools and runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev dbus-x11 xvfb xauth
      - name: Locate NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsisPath = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (!(Test-Path -LiteralPath (Join-Path $nsisPath 'makensis.exe'))) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install NSIS.' }
          }
          $nsisPath >> $env:GITHUB_PATH
      - name: Install Wails
        env:
          GODEBUG: ${{ runner.os == 'Linux' && 'http2client=0' || '' }}
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build production app
        run: wails3 build
      - name: Run Go checks
        run: |
          test -z "$(gofmt -l main.go storage_*.go internal)"
          go test . ./internal/...
          go vet . ./internal/...
      - name: Run frontend checks
        working-directory: frontend
        run: |
          bun run format:check
          bun run lint
          bun run typecheck
          bun run test
      - name: Build and test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          wails3 package INSTALL_SCOPE=user
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -tags 'production,fittrack_smoke' -o bin/fittrack-smoke.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-windows.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/check-windows-package.ps1
      - name: Build and inspect macOS disk image
        if: runner.os == 'macOS'
        run: |
          wails3 task darwin:package:universal
          wails3 task darwin:create:dmg
          image=(bin/*.dmg)
          hdiutil verify "${image[0]}"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/FitTrack-volume" "${image[0]}"
          trap 'hdiutil detach "$RUNNER_TEMP/FitTrack-volume"' EXIT
          ditto "$RUNNER_TEMP/FitTrack-volume/fittrack.app" "$RUNNER_TEMP/fittrack.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/fittrack.app"
          # lipo treats everything after -verify_arch as an architecture.
          lipo "$RUNNER_TEMP/fittrack.app/Contents/MacOS/fittrack" -verify_arch x86_64 arm64
          database="$HOME/Library/Application Support/FitTrack/fittrack.sqlite3"
          test ! -e "$database"
          launch() {
            "$RUNNER_TEMP/fittrack.app/Contents/MacOS/fittrack" &
            app_pid=$!
            for attempt in {1..40}; do
              kill -0 "$app_pid" || return 1
              if test -s "$database"; then
                sleep 2
                kill -0 "$app_pid" || return 1
                kill -TERM "$app_pid"
                wait "$app_pid" || test "$?" -eq 143
                return
              fi
              sleep 0.25
            done
            kill -TERM "$app_pid"
            return 1
          }
          launch
          before=$(shasum -a 256 "$database")
          rm -rf -- "$RUNNER_TEMP/fittrack.app"
          ditto "$RUNNER_TEMP/FitTrack-volume/fittrack.app" "$RUNNER_TEMP/fittrack.app"
          launch
          test "$(shasum -a 256 "$database")" = "$before"
      - name: Build and test Debian package
        if: runner.os == 'Linux'
        run: |
          wails3 task linux:create:deb
          packages=(bin/*.deb)
          bash scripts/check-deb-package.sh "${packages[0]}"
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: FitTrack-Windows-x64
          path: |
            bin/*-installer.exe
            bin/fittrack.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: FitTrack-macOS-universal
          path: bin/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: FitTrack-Linux-amd64
          path: bin/*.deb
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json
      - name: Set package version from release tag
        if: github.ref_type == 'tag'
        run: node scripts/set-release-version.mjs "$GITHUB_REF_NAME"
      - name: Set up Android SDK, build tools, and NDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865'
      - name: Install Linux dependencies for the Wails CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install Wails
        env:
          GODEBUG: http2client=0
        run: |
          wails_version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$wails_version"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Prepare Android signing key
        if: github.ref_type == 'tag'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fittrack-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/fittrack-release.jks" >> "$GITHUB_ENV"
      - name: Build and verify preview APK
        if: github.ref_type != 'tag'
        run: node scripts/build-android.mjs
      - name: Build and verify release APK
        if: github.ref_type == 'tag'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/build-android.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: FitTrack-Android
          path: bin/FitTrack-*-Android.apk
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    # Require every native build and package check before publishing.
    needs: [native, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: native-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: FitTrack-*
          path: packages
      - name: Publish release with installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # An unmatched glob must produce an empty array so a missing installer fails the count check.
          shopt -s nullglob
          windows=(packages/FitTrack-Windows-x64/*-installer.exe)
          macos=(packages/FitTrack-macOS-universal/*.dmg)
          linux=(packages/FitTrack-Linux-amd64/*.deb)
          android=(packages/FitTrack-Android/*.apk)
          portable=packages/FitTrack-Windows-x64/fittrack.exe
          test "${#windows[@]}" -eq 1
          test "${#macos[@]}" -eq 1
          test "${#linux[@]}" -eq 1
          test "${#android[@]}" -eq 1
          for asset in "${windows[@]}" "${macos[@]}" "${linux[@]}" "${android[@]}" "$portable"; do
            test -s "$asset"
          done
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if ! test -s "$notes"; then
            echo "Missing release notes: $notes" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "$notes" \
            --title "FitTrack $GITHUB_REF_NAME" \
            "${windows[0]}" "${macos[0]}" "${linux[0]}" "${android[0]}" "$portable"
